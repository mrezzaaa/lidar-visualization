<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CygLiDAR D1 Direct WebSerial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0a0a; color: white; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 320px; width: calc(100% - 320px); height: 100%; }
        #sidebar {
            position: absolute; top: 0; left: 0; width: 320px; height: 100%;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px; box-sizing: border-box; overflow-y: auto;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .btn { width: 100%; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: all 0.2s; margin-top: 5px; }
        .btn-primary { background: #4ecca3; color: #1a1a2e; }
        .btn-primary:hover { background: #3db88c; }
        .btn-danger { background: #e84545; color: white; }
        .btn-danger:hover { background: #d63939; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        
        .status-badge { display: block; padding: 6px; border-radius: 6px; font-size: 12px; font-weight: bold; text-align: center; margin-top: 10px; }
        .status-disconnected { background: rgba(255,255,255,0.1); color: #aaa; }
        .status-connected { background: #4ecca3; color: #1a1a2e; }
        
        .section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .section h3 { font-size: 12px; font-weight: bold; text-transform: uppercase; color: #93deff; margin-bottom: 10px; letter-spacing: 1px; }
        
        label { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px; margin-top: 8px; }
        select, input { width: 100%; padding: 8px; background: rgba(0,0,0,0.3); color: white; border: 1px solid #444; border-radius: 4px; font-size: 13px; }
        .info-row { display: flex; justify-content: space-between; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 5px 0; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #aaa; }
        .info-val { font-family: monospace; }
        
        #fpsCounter { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; font-family: monospace; pointer-events: none; }
    </style>
</head>
<body>

<div id="sidebar">
    <h1 class="text-xl font-bold mb-6 text-green-400">🛰️ CygLiDAR Direct</h1>

    <!-- CONNECTION -->
    <div class="section">
        <h3>Connection</h3>
        <label>Baud Rate</label>
        <select id="baudRate">
            <option value="3000000" selected>3,000,000 bps</option>
            <option value="921600">921,600 bps</option>
            <option value="115200">115,200 bps</option>
        </select>
        <button id="btnConnect" class="btn btn-primary" onclick="connectSerial()">Connect</button>
        <button id="btnDisconnect" class="btn btn-danger hidden" onclick="disconnectSerial()">Disconnect</button>
        <div id="statusBadge" class="status-badge status-disconnected">Disconnected</div>
    </div>

    <!-- DEVICE INFO -->
    <div class="section">
        <h3>Device Info</h3>
        <div class="info-row"><span class="info-label">Model</span> <span class="info-val">CygLiDAR D1</span></div>
        <div class="info-row"><span class="info-label">Version</span> <span class="info-val" id="infoVer">--.--.--</span></div>
        <div class="info-row"><span class="info-label">HW</span> <span class="info-val" id="infoHW">--.--.--</span></div>
        <div class="info-row"><span class="info-label">Serial</span> <span class="info-val" id="infoSerial">--</span></div>
        <button class="btn btn-secondary" onclick="getDeviceInfo()">Get Info</button>
    </div>

    <!-- SCAN CONTROL -->
    <div class="section">
        <h3>Scan Control</h3>
        <label>Mode</label>
        <select id="scanMode">
            <option value="2D">2D Scan</option>
            <option value="3D">3D Scan (Exp)</option>
        </select>
        <div class="grid grid-cols-2 gap-2 mt-2">
            <button class="btn btn-primary" onclick="startScan()">Start</button>
            <button class="btn btn-danger" onclick="stopScan()">Stop</button>
        </div>
    </div>

    <!-- CONFIGURATION -->
    <div class="section">
        <h3>Configuration</h3>
        <label>Frequency Channel (0-15)</label>
        <div class="flex gap-2">
            <input type="number" id="freqInput" value="0" min="0" max="15">
            <button class="btn btn-secondary w-auto" onclick="setFrequency()">Set</button>
        </div>

        <label>Pulse Width (μs)</label>
        <div class="flex gap-2">
            <input type="number" id="pulseInput" value="1000" step="100">
            <button class="btn btn-secondary w-auto" onclick="setPulse()">Set</button>
        </div>
    </div>

    <!-- STATISTICS -->
    <div class="section">
        <h3>Statistics</h3>
        <div class="info-row"><span class="info-label">Points</span> <span class="info-val" id="statPoints">0</span></div>
        <div class="info-row"><span class="info-label">Valid</span> <span class="info-val text-green-400" id="statValid">0</span></div>
        <div class="info-row"><span class="info-label">Errors</span> <span class="info-val text-red-400" id="statErrors">0</span></div>
    </div>

    <div class="text-xs text-gray-500 text-center mt-4">
        Zero-Latency Mode • Big Endian
    </div>
</div>

<div id="canvas-container"></div>
<div id="fpsCounter">FPS: 0</div>

<script>
    // --- THREE.JS SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);
    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 5, 5); 
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    scene.add(new THREE.GridHelper(10, 20, 0x444444, 0x222222));
    scene.add(new THREE.AxesHelper(1));

    // Points
    const MAX_POINTS = 1000; 
    const pointsGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(MAX_POINTS * 3);
    const colors = new Float32Array(MAX_POINTS * 3);
    pointsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    pointsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const cloud = new THREE.Points(pointsGeometry, new THREE.PointsMaterial({ size: 0.1, vertexColors: true }));
    scene.add(cloud);

    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    animate();
    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // --- WEBSERIAL LOGIC ---
    let port, reader, writer, keepReading = false;
    let serialBuffer = new Uint8Array(0);
    let frames = 0;
    setInterval(() => { document.getElementById('fpsCounter').innerText = `FPS: ${frames}`; frames = 0; }, 1000);

    // COMMANDS (from config.ts)
    const CMD = {
        scan2D: new Uint8Array([0x5a, 0x77, 0xff, 0x02, 0x00, 0x01, 0x00, 0x03]),
        scan3D: new Uint8Array([0x5a, 0x77, 0xff, 0x02, 0x00, 0x08, 0x00, 0x0A]),
        stop:   new Uint8Array([0x5a, 0x77, 0xff, 0x02, 0x00, 0x02, 0x00, 0x00]),
        info:   new Uint8Array([0x5A, 0x77, 0xFF, 0x02, 0x00, 0x10, 0x00, 0x12]),
        // Fixed payloads from legacy backend
        freq:   new Uint8Array([0x5A, 0x77, 0x03, 0x00, 0x00, 0x00]), 
        pulse:  new Uint8Array([0x5a, 0x77, 0xff, 0x03, 0x00, 0x0c, 0x10, 0x67, 0x78])
    };

    async function connectSerial() {
        if (!navigator.serial) return alert("WebSerial not supported");
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: parseInt(document.getElementById('baudRate').value) });
            keepReading = true;
            updateUI(true);
            readLoop();
        } catch (err) { console.error(err); alert("Connection Failed: " + err.message); }
    }

    async function disconnectSerial() {
        keepReading = false;
        if (reader) await reader.cancel();
        if (port) await port.close();
        updateUI(false);
    }

    async function sendCommand(data) {
        if (!port || !port.writable) return;
        const writer = port.writable.getWriter();
        await writer.write(data);
        writer.releaseLock();
        console.log("Sent:", data);
    }

    // UI Actions
    async function startScan() {
        const mode = document.getElementById('scanMode').value;
        if (mode === '2D') await sendCommand(CMD.scan2D);
        else await sendCommand(CMD.scan3D);
    }
    async function stopScan() { await sendCommand(CMD.stop); }
    async function getDeviceInfo() { await sendCommand(CMD.info); }
    async function setFrequency() { await sendCommand(CMD.freq); } // Using fixed legacy packet
    async function setPulse() { await sendCommand(CMD.pulse); }   // Using fixed legacy packet

    async function readLoop() {
        reader = port.readable.getReader();
        while (keepReading) {
            try {
                const { value, done } = await reader.read();
                if (done) break;
                if (value) {
                    const newBuffer = new Uint8Array(serialBuffer.length + value.length);
                    newBuffer.set(serialBuffer);
                    newBuffer.set(value, serialBuffer.length);
                    serialBuffer = newBuffer;
                    processBuffer();
                }
            } catch (error) { console.error(error); break; }
        }
    }

    // --- PARSER (Dynamic Protocol per Manual) ---
    // Header: 5A 77 FF
    // Length: LSB MSB (2 bytes)
    // PayloadHeader: 1 byte
    // Data...
    // Checksum: 1 byte
    
    const HEAD = [0x5A, 0x77, 0xFF];

    function processBuffer() {
        while (serialBuffer.length >= 6) { // Min size for Head+Len+Type
            
            // 1. Find Header 5A 77 FF
            let headIdx = -1;
            for (let i = 0; i < serialBuffer.length - 2; i++) {
                if (serialBuffer[i] === 0x5A && serialBuffer[i+1] === 0x77 && serialBuffer[i+2] === 0xFF) {
                    headIdx = i;
                    break;
                }
            }

            // No header? Keep overlap and wait
            if (headIdx === -1) {
                if (serialBuffer.length > 2000) serialBuffer = serialBuffer.slice(serialBuffer.length - 10);
                return;
            }

            // Align buffer
            if (headIdx > 0) {
                serialBuffer = serialBuffer.slice(headIdx);
                continue;
            }

            // 2. Parse Length (Bytes 3, 4) - Little Endian
            const lenLSB = serialBuffer[3];
            const lenMSB = serialBuffer[4];
            const payloadLen = (lenMSB << 8) | lenLSB; 
            
            // SANITY CHECK: 2D Payload should be ~323 bytes. 
            // If it's huge (e.g. 20000), it's a false header match.
            if (payloadLen > 1000) {
                // False header, skip this 0x5A
                serialBuffer = serialBuffer.slice(1);
                continue;
            }

            // Total Packet = 3(Head) + 2(Len) + payloadLen + 1(CS)
            const totalSize = 6 + payloadLen;

            if (serialBuffer.length < totalSize) return; // Wait for full packet

            // 3. Extract Packet
            const packet = serialBuffer.slice(0, totalSize);
            
            // 4. Validate Checksum (Strict)
            let calcCS = 0;
            for (let i = 3; i < totalSize - 1; i++) {
                calcCS ^= packet[i];
            }
            const recvCS = packet[totalSize - 1];

            if (calcCS === recvCS) {
                // Checksum OK
                const type = packet[5];
                if (type === 0x01) {
                    parse2D(packet, payloadLen);
                    frames++;
                } else if (type === 0x10) {
                    parseInfo(packet);
                }
            } else {
                // Checksum FAIL
                document.getElementById('statErrors').innerText = parseInt(document.getElementById('statErrors').innerText) + 1;
                
                // Debug Log: Print first 10 bytes to see what we received
                // console.warn(`CS Fail: Calc ${calcCS.toString(16)} != Recv ${recvCS.toString(16)}. Len: ${payloadLen}`);
                // console.log("Header:", packet.slice(0, 10));

                // SOFT VALIDATION: Try to parse anyway.
                // If it's valid data, it will render. If garbage, parse2D should handle it safely.
                const type = packet[5];
                if (type === 0x01) {
                    parse2D(packet, payloadLen);
                    frames++;
                }
            }

            // Advance
            serialBuffer = serialBuffer.slice(totalSize);
        }
    }

    function parse2D(pkt, payloadLen) {
        const dataLen = payloadLen - 1;
        const numPoints = Math.floor(dataLen / 2); 

        // Update Scan Stats
        document.getElementById('statPoints').innerText = numPoints;

        // Temporary buffers
        const tempPositions = new Float32Array(MAX_POINTS * 3);
        const tempColors = new Float32Array(MAX_POINTS * 3);
        
        let validCount = 0;
        let pIndex = 0;

        for(let i=0; i<numPoints; i++) {
            if (pIndex >= MAX_POINTS*3) break;

            const off = 6 + (i*2);
            const dist = (pkt[off] << 8) | pkt[off+1]; // Big Endian
            
            // Dynamic Angle Step
            const step = 120.0 / (numPoints - 1 || 1); 
            const angleDeg = -60 + (i * step);
            const angleRad = angleDeg * (Math.PI/180);

            if (dist > 0 && dist < 10000 && dist < 16000) {
                const dm = dist/1000.0;
                tempPositions[pIndex] = Math.sin(angleRad) * dm;
                tempPositions[pIndex+1] = 0;
                tempPositions[pIndex+2] = Math.cos(angleRad) * dm;

                const hue = (1.0 - Math.min(dm/3, 1)) * 0.3;
                const col = new THREE.Color().setHSL(hue, 1, 0.5);
                tempColors[pIndex] = col.r;
                tempColors[pIndex+1] = col.g;
                tempColors[pIndex+2] = col.b;

                pIndex += 3;
                validCount++;
            }
        }

        // STABILITY CHECK: Only update screen if we actually decoded valid points
        if (validCount > 0) {
            const positions = pointsGeometry.attributes.position.array;
            const colors = pointsGeometry.attributes.color.array;
            
            // Clear old
            positions.fill(0);
            colors.fill(0);

            // Copy new
            positions.set(tempPositions);
            colors.set(tempColors);

            pointsGeometry.attributes.position.needsUpdate = true;
            pointsGeometry.attributes.color.needsUpdate = true;
            document.getElementById('statValid').innerText = validCount;
        }
    }

    function parseInfo(pkt) {
        // Payload start index 5. Length 7.
        // Data format from legacy: Major, Minor, Patch, HW1, HW2, HW3 (Hex strings)
        // Packet: 5A 77 FF 07 00 10 [Ver 3bytes] [HW 3bytes] CS
        // Actually legacy parser sliced bytes 6-12 of the string...
        // Let's just show hex values
        const ver = `${pkt[6].toString(16)}.${pkt[7].toString(16)}.${pkt[8].toString(16)}`;
        const hw = `${pkt[9].toString(16)}.${pkt[10].toString(16)}.${pkt[11].toString(16)}`;
        document.getElementById('infoVer').innerText = ver;
        document.getElementById('infoHW').innerText = hw;
        document.getElementById('infoSerial').innerText = "Detected";
    }

    function updateUI(connected) {
        document.getElementById('btnConnect').classList.toggle('hidden', connected);
        document.getElementById('btnDisconnect').classList.toggle('hidden', !connected);
        const b = document.getElementById('statusBadge');
        b.innerText = connected ? "Connected" : "Disconnected";
        b.className = `status-badge ${connected ? 'status-connected' : 'status-disconnected'}`;
    }
</script>
</body>
</html>
