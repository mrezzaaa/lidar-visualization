<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CygLiDAR D1 Direct WebSerial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0a0a; color: white; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 320px; width: calc(100% - 320px); height: 100%; }
        #sidebar {
            position: absolute; top: 0; left: 0; width: 320px; height: 100%;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px; box-sizing: border-box; overflow-y: auto;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .btn { width: 100%; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: all 0.2s; margin-top: 5px; }
        .btn-primary { background: #4ecca3; color: #1a1a2e; }
        .btn-primary:hover { background: #3db88c; }
        .btn-danger { background: #e84545; color: white; }
        .btn-danger:hover { background: #d63939; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        
        .status-badge { display: block; padding: 6px; border-radius: 6px; font-size: 12px; font-weight: bold; text-align: center; margin-top: 10px; }
        .status-disconnected { background: rgba(255,255,255,0.1); color: #aaa; }
        .status-connected { background: #4ecca3; color: #1a1a2e; }
        
        .section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .section h3 { font-size: 12px; font-weight: bold; text-transform: uppercase; color: #93deff; margin-bottom: 10px; letter-spacing: 1px; }
        
        label { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px; margin-top: 8px; }
        select, input { width: 100%; padding: 8px; background: rgba(0,0,0,0.3); color: white; border: 1px solid #444; border-radius: 4px; font-size: 13px; }
        .info-row { display: flex; justify-content: space-between; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 5px 0; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #aaa; }
        .info-val { font-family: monospace; }
        
        #fpsCounter { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; font-family: monospace; pointer-events: none; }
    </style>
</head>
<body>

<div id="sidebar">
    <h1 class="text-xl font-bold mb-6 text-green-400">🛰️ CygLiDAR Direct</h1>

    <!-- CONNECTION -->
    <div class="section">
        <h3>Connection</h3>
        <label>Baud Rate</label>
        <select id="baudRate">
            <option value="3000000" selected>3,000,000 bps</option>
            <option value="921600">921,600 bps</option>
            <option value="115200">115,200 bps</option>
        </select>
        <button id="btnConnect" class="btn btn-primary" onclick="connectSerial()">Connect</button>
        <button id="btnDisconnect" class="btn btn-danger hidden" onclick="disconnectSerial()">Disconnect</button>
        <div id="statusBadge" class="status-badge status-disconnected">Disconnected</div>
    </div>

    <!-- DEVICE INFO -->
    <div class="section">
        <h3>Device Info</h3>
        <div class="info-row"><span class="info-label">Model</span> <span class="info-val">CygLiDAR D1</span></div>
        <div class="info-row"><span class="info-label">Version</span> <span class="info-val" id="infoVer">--.--.--</span></div>
        <div class="info-row"><span class="info-label">HW</span> <span class="info-val" id="infoHW">--.--.--</span></div>
        <div class="info-row"><span class="info-label">Serial</span> <span class="info-val" id="infoSerial">--</span></div>
        <button class="btn btn-secondary" onclick="getDeviceInfo()">Get Info</button>
    </div>

    <!-- SCAN CONTROL -->
    <div class="section">
        <h3>Scan Control</h3>
        <label>Mode</label>
        <select id="scanMode">
            <option value="2D">2D Scan</option>
            <option value="3D">3D Scan</option>
            <option value="Dual">Dual Mode</option>
        </select>
        <div class="grid grid-cols-2 gap-2 mt-2">
            <button class="btn btn-primary" onclick="startScan()">Start</button>
            <button class="btn btn-danger" onclick="stopScan()">Stop</button>
        </div>
    </div>

    <!-- SLAM CONTROL -->
    <div class="section">
        <h3>SLAM Mapping</h3>
        <div class="grid grid-cols-2 gap-2">
            <button id="btnMap" class="btn btn-secondary" onclick="toggleMapping()">Start Map</button>
            <button class="btn btn-danger" onclick="resetMap()">Reset</button>
        </div>
        <div class="text-xs text-gray-500 mt-2">
            Use <b>WASD</b> to move Robot manually (Simulated Odom).
        </div>
    </div>

    <!-- CONFIGURATION -->
    <div class="section">
        <h3>Configuration</h3>
        <label>Frequency Channel (0-15)</label>
        <div class="flex gap-2">
            <input type="number" id="freqInput" value="0" min="0" max="15">
            <button class="btn btn-secondary w-auto" onclick="setFrequency()">Set</button>
        </div>

        <label>Pulse Width (μs)</label>
        <div class="flex gap-2">
            <input type="number" id="pulseInput" value="1000" step="100">
            <button class="btn btn-secondary w-auto" onclick="setPulse()">Set</button>
        </div>
    </div>

    <!-- STATISTICS -->
    <div class="section">
        <h3>Statistics</h3>
        <div class="info-row"><span class="info-label">Points</span> <span class="info-val" id="statPoints">0</span></div>
        <div class="info-row"><span class="info-label">Valid</span> <span class="info-val text-green-400" id="statValid">0</span></div>
        <div class="info-row"><span class="info-label">Errors</span> <span class="info-val text-red-400" id="statErrors">0</span></div>
    </div>

    <div class="text-xs text-gray-500 text-center mt-4">
        Zero-Latency Mode • Big Endian
    </div>
</div>

<div id="canvas-container"></div>
<div id="fpsCounter">FPS: 0</div>
<div id="tooltip" class="absolute hidden bg-black bg-opacity-80 text-white text-xs px-2 py-1 rounded pointer-events-none border border-green-400" style="z-index: 1000;"></div>

<script src="3d_constants.js"></script>
<script>
    // --- 3D MATH TABLES ---
    const tablex = new Float32Array(160 * 60);
    const tabley = new Float32Array(160 * 60);
    const tablez = new Float32Array(160 * 60);

    // Initial Distortion Calculation (Ported from lidar.ts)
    function initDistortion3D() {
        const width = 160;
        const height = 60;
        const _sensor_point_size_mm = 0.02; // PIXEL_REAL_SIZE from CYG_Constant.h line 37
        const _center_point_offset_x = 0.0; // OFFSET_CENTER_POINT_X from CYG_Constant.h line 38
        const _center_point_offset_y = 0.0; // OFFSET_CENTER_POINT_Y from CYG_Constant.h line 39
        const row0 = 1 - (height / 2) + _center_point_offset_x;
        const col0 = 1 - (width / 2) + _center_point_offset_y;

        function getAngle(x, y) {
            let radius = _sensor_point_size_mm * Math.sqrt((x * x) + (y * y));
            let alfaGrad = 0;
            for (let i = 1; i < lidarAngleCamera.length; i++) {
                if (radius >= lidarRealImageSize[i - 1] && radius <= lidarRealImageSize[i]) {
                    // Map range
                    const in_min = lidarRealImageSize[i - 1]; 
                    const in_max = lidarRealImageSize[i];
                    const out_min = lidarAngleCamera[i - 1];
                    const out_max = lidarAngleCamera[i];
                    alfaGrad = (radius - in_min) * (out_max - out_min) / (in_max - in_min) + out_min;
                    break;
                }
            }
            return alfaGrad;
        }

        for (let y = 0, r = row0; y < 60; r++, y++) {
            for (let x = 0, c = col0; x < 160; c++, x++) {
                const column = c - 0.5;
                const row    = r - 0.5;
                const angle_grad = getAngle(column, row);
                const angle_rad = angle_grad * (Math.PI / 180);

                const hyp_sq = (column * column) + (row * row);
                const hyp = Math.sqrt(hyp_sq);
                const sin_angle = Math.sin(angle_rad);
                
                // NO scaling - pure trig as per official implementation
                const x_val = column * (sin_angle / hyp);
                const y_val = row    * (sin_angle / hyp);
                const z_val = Math.cos(angle_rad);

                const exactIdx = x + (y * 160);
                tablex[exactIdx] = x_val;
                tabley[exactIdx] = y_val;
                tablez[exactIdx] = z_val;
            }
        }
        
        // Debug: Check for NaN/Infinity
        let nanCount = 0, infCount = 0;
        for (let i = 0; i < 9600; i++) {
            if (isNaN(tablex[i]) || isNaN(tabley[i]) || isNaN(tablez[i])) nanCount++;
            if (!isFinite(tablex[i]) || !isFinite(tabley[i]) || !isFinite(tablez[i])) infCount++;
        }
        console.log(`3D Tables: ${nanCount} NaN, ${infCount} Inf values`);
        console.log(`Corner[0]: x=${tablex[0].toFixed(4)}, y=${tabley[0].toFixed(4)}, z=${tablez[0].toFixed(4)}`);
        console.log(`Center[4800]: x=${tablex[4800].toFixed(4)}, y=${tabley[4800].toFixed(4)}, z=${tablez[4800].toFixed(4)}`);
    }
    initDistortion3D();

    // --- THREE.JS SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);
    
    // Use OrthographicCamera to avoid perspective distortion
    const aspect = container.clientWidth / container.clientHeight;
    const frustumSize = 10;
    const camera = new THREE.OrthographicCamera(
        frustumSize * aspect / -2,  // left
        frustumSize * aspect / 2,   // right
        frustumSize / 2,            // top
        frustumSize / -2,           // bottom
        0.1,                        // near
        100                         // far
    );
    camera.position.set(0, 10, 0);  // Top-down view
    camera.lookAt(0, 0, 0); 
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    scene.add(new THREE.GridHelper(10, 20, 0x444444, 0x222222));
    scene.add(new THREE.AxesHelper(1));

    // HOVER INTERACTION
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    raycaster.params.Line.threshold = 0.2; // Hit tolerance for lines
    raycaster.params.Points.threshold = 0.2; // Hit tolerance for points
    
    // Hover Marker (Pulsing Sphere)
    const markerGeo = new THREE.SphereGeometry(0.1, 16, 16);
    const markerMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8 });
    const hoverMarker = new THREE.Mesh(markerGeo, markerMat);
    hoverMarker.visible = false;
    scene.add(hoverMarker);
    const tooltip = document.getElementById('tooltip');

    window.addEventListener('mousemove', (event) => {
        const rect = container.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        
        tooltip.style.left = event.clientX + 15 + 'px';
        tooltip.style.top = event.clientY + 15 + 'px';
    });

    // --- SLAM VISUALIZATION ---
    // 1. Live Scan (Red Line)
    // 2. Global Map (White/Gray Points)
    // 3. Robot Pose (Green Arrow)

    // 1. Live Scan
    const MAX_POINTS = 1000; 
    const pointsGeometry = new THREE.BufferGeometry();
    // LineSegments needs 2 points per segment, so size is doubled effectively? 
    // Actually we iterate validCount and add pairs. Worst case (MAX_POINTS) segments * 2 vertices = MAX*2.
    const positions = new Float32Array(MAX_POINTS * 3 * 2);
    const colors = new Float32Array(MAX_POINTS * 3 * 2);
    pointsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    pointsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    // Changed to LINE SEGMENTS for discontinuous filtering
    const cloud = new THREE.LineSegments(pointsGeometry, new THREE.LineBasicMaterial({ vertexColors: true, linewidth: 2 }));
    scene.add(cloud);

    // 2. Global Map
    const MAP_SIZE = 20000;
    const mapGeo = new THREE.BufferGeometry();
    const mapPos = new Float32Array(MAP_SIZE * 3);
    mapGeo.setAttribute('position', new THREE.BufferAttribute(mapPos, 3));
    const mapMat = new THREE.PointsMaterial({ size: 0.05, color: 0x888888 });
    const globalMap = new THREE.Points(mapGeo, mapMat);
    globalMap.frustumCulled = false;
    scene.add(globalMap);
    let mapIndex = 0;

    // 2b. 3D Cloud
    const POINTS_3D = 9600; // 160 * 60
    const geo3D = new THREE.BufferGeometry();
    const pos3D = new Float32Array(POINTS_3D * 3);
    const col3D = new Float32Array(POINTS_3D * 3);
    geo3D.setAttribute('position', new THREE.BufferAttribute(pos3D, 3));
    geo3D.setAttribute('color', new THREE.BufferAttribute(col3D, 3));
    const mat3D = new THREE.PointsMaterial({ 
        size: 0.02,  // Smaller, more precise points
        vertexColors: true,
        sizeAttenuation: true,  // Points get smaller with distance
        transparent: true,
        opacity: 0.9
    });
    const cloud3D = new THREE.Points(geo3D, mat3D);
    cloud3D.frustumCulled = false;
    scene.add(cloud);
    scene.add(cloud3D);
    
    // Clean scene - only axes for reference
    const axesHelper = new THREE.AxesHelper(2);
    scene.add(axesHelper);

    // 3. Robot Pose
    const robotGroup = new THREE.Group();
    const arrow = new THREE.ArrowHelper(new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,0), 0.5, 0x00ff00);
    robotGroup.add(arrow);
    scene.add(robotGroup);

    // SLAM State
    let robotPose = { x: 0, y: 0, theta: 0 };
    let lastScanPoints = []; // For ICP reference
    let isMapping = false;

    // --- ICP ALGORITHM (Simplified) ---
    const ICP_MAX_ITER = 10;
    const ICP_TOLERANCE = 0.001;

    function runICP(refPts, currPts, guessPose) {
        // Very basic ICP: 
        // 1. Find correspondences (Naive closest point)
        // 2. Compute Transform (Centroids + SVD-ish)
        // This is a simplified 2D version for Browser Performance.
        
        let pose = { ...guessPose };
        
        // Optimization: Use subset of points for speed
        const stride = 2; 

        // Naive iteration
        for(let iter=0; iter<3; iter++) { // Low iterations for real-time
            let numMatches = 0;
            let sumXRef = 0, sumYRef = 0;
            let sumXCurr = 0, sumYCurr = 0;

            // Rotate current points by current Pose Guess
            const cos = Math.cos(pose.theta);
            const sin = Math.sin(pose.theta);

            for(let i=0; i<currPts.length; i+=stride) {
                // Apply current pose to point
                const px = currPts[i].x * cos - currPts[i].y * sin + pose.x;
                const py = currPts[i].x * sin + currPts[i].y * cos + pose.y;

                // Find Closest in Ref
                let minDist = 0.5; // Max matching distance 50cm
                let closest = null;

                for(let j=0; j<refPts.length; j+=stride) {
                    const dx = px - refPts[j].x;
                    const dy = py - refPts[j].y;
                    const d2 = dx*dx + dy*dy;
                    if(d2 < minDist*minDist) {
                        minDist = Math.sqrt(d2);
                        closest = refPts[j];
                    }
                }

                if(closest) {
                    sumXRef += closest.x; sumYRef += closest.y;
                    sumXCurr += px; sumYCurr += py; // Roughly
                    numMatches++;
                }
            }
            
            // This naive ICP doesn't actually SOLVE the rotation properly without SVD.
            // For this specific 'Implementation Plan', we'll use a Odometry-assist approach later.
            // But for now, let's just stick to a very simple accumulation if movement is small.
            // Actually, without complex matrix math libraries, writing a full SVD ICP in raw JS is risky.
            // Let's implement a simpler "Odom" accumulation for now, assuming the user holds it steady,
            // OR just map accumulation in global frame if we assume sensor is static (Mapping mode).
            // BUT user asked for SLAM. Let's try to infer delta.
            
            // Correct approach without Matrix lib: centroid matching
            if(numMatches > 10) {
                 const cenRefX = sumXRef / numMatches;
                 const cenRefY = sumYRef / numMatches;
                 const cenCurrX = sumXCurr / numMatches;
                 const cenCurrY = sumYCurr / numMatches;
                 pose.x += (cenRefX - cenCurrX) * 0.1; // Gain
                 pose.y += (cenRefY - cenCurrY) * 0.1;
            }
        }
        return pose;
    }

    function animate() { 
        requestAnimationFrame(animate); 
        controls.update(); 
        
        // Raycasting
        raycaster.setFromCamera(mouse, camera);
        
        // Check intersections with both Live Cloud and Global Map
        const objectsToCheck = [cloud, globalMap];
        const intersects = raycaster.intersectObjects(objectsToCheck);

        if (intersects.length > 0) {
            const hit = intersects[0];
            const dist = hit.point.distanceTo(new THREE.Vector3(0,0,0)); // Distance from origin
            // Or distance from Robot Pose? Usually user wants distance from Sensor (Origin).
            
            // Show Marker
            hoverMarker.visible = true;
            hoverMarker.position.copy(hit.point);
            
            // Pulse Animation
            const scale = 1 + Math.sin(Date.now() * 0.01) * 0.3;
            hoverMarker.scale.set(scale, scale, scale);

            // Show Tooltip
            tooltip.innerText = `Dist: ${dist.toFixed(2)}m`;
            tooltip.classList.remove('hidden');
            document.body.style.cursor = 'crosshair';
        } else {
            hoverMarker.visible = false;
            tooltip.classList.add('hidden');
            document.body.style.cursor = 'default';
        }

        renderer.render(scene, camera); 
    }
    animate();
    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // --- WEBSERIAL LOGIC ---
    let port, reader, writer, keepReading = false;
    let serialBuffer = new Uint8Array(0);
    let frames = 0;
    setInterval(() => { document.getElementById('fpsCounter').innerText = `FPS: ${frames}`; frames = 0; }, 1000);

    // COMMANDS (from config.ts)
    // COMMANDS (from config.ts)
    const CMD = {
        scan2D: new Uint8Array([0x5a, 0x77, 0xff, 0x02, 0x00, 0x01, 0x00, 0x03]),
        scan3D: new Uint8Array([0x5a, 0x77, 0xff, 0x02, 0x00, 0x08, 0x00, 0x0A]),
        scanDual: new Uint8Array([0x5a, 0x77, 0xff, 0x02, 0x00, 0x07, 0x00, 0x05]),
        stop:   new Uint8Array([0x5a, 0x77, 0xff, 0x02, 0x00, 0x02, 0x00, 0x00]),
        info:   new Uint8Array([0x5A, 0x77, 0xFF, 0x02, 0x00, 0x10, 0x00, 0x12]),
        // Fixed payloads from legacy backend
        freq:   new Uint8Array([0x5A, 0x77, 0x03, 0x00, 0x00, 0x00]), 
        pulse:  new Uint8Array([0x5a, 0x77, 0xff, 0x03, 0x00, 0x0c, 0x10, 0x67, 0x78])
    };

    async function connectSerial() {
        if (!navigator.serial) return alert("WebSerial not supported");
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: parseInt(document.getElementById('baudRate').value) });
            keepReading = true;
            updateUI(true);
            readLoop();
        } catch (err) { console.error(err); alert("Connection Failed: " + err.message); }
    }

    async function disconnectSerial() {
        keepReading = false;
        if (reader) await reader.cancel();
        if (port) await port.close();
        updateUI(false);
    }

    async function sendCommand(data) {
        if (!port || !port.writable) return;
        const writer = port.writable.getWriter();
        await writer.write(data);
        writer.releaseLock();
        console.log("Sent:", data);
    }

    // UI Actions
    async function startScan() {
        const mode = document.getElementById('scanMode').value;
        if (mode === '2D') await sendCommand(CMD.scan2D);
        else if (mode === '3D') await sendCommand(CMD.scan3D);
        else await sendCommand(CMD.scanDual);
    }
    async function stopScan() { await sendCommand(CMD.stop); }
    async function getDeviceInfo() { await sendCommand(CMD.info); }
    async function setFrequency() { await sendCommand(CMD.freq); } // Using fixed legacy packet
    async function setPulse() { await sendCommand(CMD.pulse); }   // Using fixed legacy packet

    async function readLoop() {
        reader = port.readable.getReader();
        while (keepReading) {
            try {
                const { value, done } = await reader.read();
                if (done) break;
                if (value) {
                    const newBuffer = new Uint8Array(serialBuffer.length + value.length);
                    newBuffer.set(serialBuffer);
                    newBuffer.set(value, serialBuffer.length);
                    serialBuffer = newBuffer;
                    processBuffer();
                }
            } catch (error) { console.error(error); break; }
        }
    }

    // --- PARSER (Dynamic Protocol per Manual) ---
    // Header: 5A 77 FF
    // Length: LSB MSB (2 bytes)
    // PayloadHeader: 1 byte
    // Data...
    // Checksum: 1 byte
    
    // --- ROBUST PARSER (Byte-by-Byte Sliding Window) ---
    // 1. Search for 5A 77 FF
    // 2. Validate Length
    // 3. Validate Checksum
    // 4. If VALID -> Process & Consume Packet
    // 5. If INVALID -> Advance 1 Byte & Retry (Crucial for recovery)
    
    // const HEAD = [0x5A, 0x77, 0xFF]; // Removed duplicate

    // --- LIDAR.TS STYLE PARSER (Replica) ---
    function processBuffer() {
        if (serialBuffer.length > 500000) {
            serialBuffer = serialBuffer.slice(serialBuffer.length - 100000);
        }

        while (serialBuffer.length >= 6) { 
            // 1. Search for Generic Header 5A 77 FF
            let headIdx = -1;
            for(let i=0; i < serialBuffer.length - 5; i++) {
                 if (serialBuffer[i] === 0x5A && serialBuffer[i+1] === 0x77 && serialBuffer[i+2] === 0xFF) {
                     headIdx = i;
                     break;
                 }
            }

            if (headIdx === -1) {
                 if (serialBuffer.length > 20) serialBuffer = serialBuffer.slice(serialBuffer.length - 10);
                 return;
            }

            // Align
            if (headIdx > 0) {
                serialBuffer = serialBuffer.slice(headIdx);
                // Loop will retry from 0
                continue;
            }

            // 2. Read Length (Bytes 3, 4)
            const lenLSB = serialBuffer[3];
            const lenMSB = serialBuffer[4];
            const payloadLen = (lenMSB << 8) | lenLSB; 
            const packetLen = 6 + payloadLen; // Header(6) + Payload

            if (serialBuffer.length < packetLen) return; // Wait for data

            // 3. Extract Type (Byte 5)
            const type = serialBuffer[5];
            const packet = serialBuffer.slice(0, packetLen);
            
            // Checksum (Optional, but good for validation)
            let calcCS = 0;
            for(let i=3; i<packetLen-1; i++) calcCS ^= packet[i];
            const recvCS = packet[packetLen-1];
            
            // Allow checksum mismatch for now if it's data data
            // (Based on user exp, checksum is finicky, let's trust Header + Length)
            
            if (type === 0x01) { // 2D (Standard or Dual)
                parse2D(packet, payloadLen);
                frames++;
            } else if (type === 0x08) { // 3D
                parse3D(packet, payloadLen);
                frames++;
            } else if (type === 0x10) { // Info
                parseInfo(packet);
            }

            serialBuffer = serialBuffer.slice(packetLen);
        }
    }

    function parse3D(pkt, payloadLen) {
        // Hide 2D, show 3D
        cloud.visible = false;
        cloud3D.visible = true;
        
        // Payload start: Index 6. Length payloadLen.
        // Data block starts at Index 6 + 1 (PayloadHeader) = Index 7?
        // Wait, Reference: Response Packet [5A 77 FF 41 38 08 ...]. 
        // 08 is Type. Data follows immediately? Or is there a padding?
        // lidar.ts: offset=3 (loop starts). 
        // parse3D in lidar.ts: serialdata.replace(header). slice(0, len).
        // Let's assume Data starts at Byte 6 (after Type).
        
        // Data Length: payloadLen - 1 (Type byte) - 1 (Checksum) ? No Checksum is IN packetLen but not PayloadLen? 
        // Logic: Total = 6 + Payload. CS is at End.
        // So Payload includes CS?
        // Packet: [5A 77 FF L L T  (Data...) CS]
        // PayloadLen = T + Data + CS?
        // Let's look at 2D. 323. Payload=323. 
        // Packet = 6 + 323 = 329.
        // Data = 329 - 6(Head) - 1(Type) - 1(CS) = 321 bytes?
        // 161 * 2 = 322. Close.
        
        // 3D: Payload 14401. 
        // Data = 14400 bytes? (160*60*1.5 = 14400).
        // So Data starts at index 6. 
        
        const dataStart = 6;
        const width = 160;
        const height = 60;
        
        const pos = geo3D.attributes.position.array;
        const col = geo3D.attributes.color.array;
        
        let pixelIdx = 0;
        
        for (let bytePos = 0; bytePos < width * height * 1.5; bytePos += 3) {
            const off = dataStart + bytePos;
            if (off + 3 > pkt.length) break;

            const b1 = pkt[off];
            const b2 = pkt[off+1];
            const b3 = pkt[off+2];

            // 12-bit Unpacking
            // P1 = b1 (8) + b2_high (4)
            // P2 = b2_low (4) + b3 (8)
            
            const val1 = (b1 << 4) | (b2 >> 4);
            const val2 = ((b2 & 0x0F) << 8) | b3;

            // Process P1 - pixel at pixelIdx
            setPoint3D(pixelIdx, val1, pos, col);
            pixelIdx++;
            
            // Process P2 - pixel at pixelIdx  
            setPoint3D(pixelIdx, val2, pos, col);
            pixelIdx++;
        }
        
        geo3D.attributes.position.needsUpdate = true;
        geo3D.attributes.color.needsUpdate = true;
        geo3D.computeBoundingSphere();
        
        // Debug: Count valid vs error points
        let validCount = 0, errorCount = 0, totalDist = 0;
        for (let i = 0; i < 9600; i++) {
            if (pos[i*3] !== 0 || pos[i*3+1] !== 0 || pos[i*3+2] !== 0) {
                validCount++;
                totalDist += Math.sqrt(pos[i*3]**2 + pos[i*3+1]**2 + pos[i*3+2]**2);
            } else {
                errorCount++;
            }
        }
        console.log(`Valid: ${validCount}, Errors: ${errorCount}, Avg dist: ${(totalDist/validCount).toFixed(2)}m`);
    }

    function setPoint3D(idx, rawDist, pos, col) {
        if (idx >= 9600) return;
        
        // D1_Const::INVALID_DATA_3D = 4080 and above are error codes
        if (rawDist >= 4080) {
            pos[idx*3] = 0; pos[idx*3+1] = 0; pos[idx*3+2] = 0;
            return;
        }

        // transformPixel - exactly like CYG_Distortion.cpp line 71-73
        const x = rawDist * tablex[idx];  // mm
        const y = rawDist * tabley[idx];  // mm
        const z = rawDist * tablez[idx];  // mm

        // Direct angular mapping (NO lens distortion correction)
        // This gives flat rectangular FOV without curved edges
        const width = 160;
        const height = 60;
        const gridRow = Math.floor(idx / width);
        const gridCol = idx % width;
        
        // Calculate angles from pixel position
        const HFOV = 120; // degrees
        const VFOV = 65;  // degrees
        const horizontalAngle = ((gridCol / width) - 0.5) * HFOV * (Math.PI / 180);
        const verticalAngle = ((gridRow / height) - 0.5) * VFOV * (Math.PI / 180);
        
        // Spherical to Cartesian (simplified - no lens correction)
        const distance_m = rawDist * 0.001;
        const x_direct = distance_m * Math.sin(horizontalAngle);
        const y_direct = distance_m * Math.sin(verticalAngle);
        const z_direct = distance_m * Math.cos(horizontalAngle) * Math.cos(verticalAngle);
        
        pos[idx*3]     =  x_direct;
        pos[idx*3+1]   = -y_direct;
        pos[idx*3+2]   = -z_direct;

        // Color heatmap (DISTANCE_MAX_VALUE_3D = 3000mm)
        const hue = (1.0 - Math.min(rawDist/3000, 1)) * 0.7;
        const c = new THREE.Color().setHSL(hue, 1, 0.5);
        col[idx*3] = c.r; col[idx*3+1] = c.g; col[idx*3+2] = c.b;
    }

    function parse2D(pkt, payloadLen) {
        // Show 2D, hide 3D
        cloud.visible = true;
        cloud3D.visible = false;
        const dataLen = payloadLen - 1;
        const numPoints = Math.floor(dataLen / 2); 

        // Update Scan Stats
        document.getElementById('statPoints').innerText = numPoints;

        // Temporary buffers
        const tempPositions = new Float32Array(MAX_POINTS * 3);
        const tempColors = new Float32Array(MAX_POINTS * 3);
        
        let validCount = 0;
        let pIndex = 0;

        for(let i=0; i<numPoints; i++) {
            if (pIndex >= MAX_POINTS*3) break;

            const off = 6 + (i*2);
            const dist = (pkt[off] << 8) | pkt[off+1]; // Big Endian
            
            // Dynamic Angle Step
            const step = 120.0 / (numPoints - 1 || 1); 
            const angleDeg = -60 + (i * step);
            const angleRad = angleDeg * (Math.PI/180);

            if (dist > 0 && dist < 10000 && dist < 16000) {
                const dm = dist/1000.0;
                // FIX MIRROR: Invert X axis (or Angle)
                // Originally: Math.sin(angleRad) * dm;
                // Mirrored:   -Math.sin(angleRad) * dm;
                tempPositions[pIndex] = -Math.sin(angleRad) * dm; 
                tempPositions[pIndex+1] = 0;
                tempPositions[pIndex+2] = Math.cos(angleRad) * dm;

                const hue = (1.0 - Math.min(dm/3, 1)) * 0.3;
                const col = new THREE.Color().setHSL(hue, 1, 0.5);
                tempColors[pIndex] = col.r;
                tempColors[pIndex+1] = col.g;
                tempColors[pIndex+2] = col.b;

                pIndex += 3;
                validCount++;
            }
        }

            // --- CONNECTIVITY FILTER (Clean Error Points) ---
            // Only draw lines between points that form a cohesive surface.
            // 1. Skip invalid points.
            // 2. Only connect if dist(p1, p2) < threshold.

            const positions = pointsGeometry.attributes.position.array;
            const colors = pointsGeometry.attributes.color.array;
            
            let lineIndex = 0;
            let cleanPoints = []; // For SLAM

            for(let i=0; i<validCount-1; i++) {
                // Get current and next point from temp buffer
                const x1 = tempPositions[i*3];
                const y1 = tempPositions[i*3+1];
                const z1 = tempPositions[i*3+2];
                
                const x2 = tempPositions[(i+1)*3];
                const y2 = tempPositions[(i+1)*3+1];
                const z2 = tempPositions[(i+1)*3+2];

                // Check distance between neighbor points
                const dx = x2 - x1;
                const dz = z2 - z1;
                const segLenSq = dx*dx + dz*dz;

                // Threshold: 30cm (0.3m). If jump is bigger, it's a discontinuity (or noise).
                // Also ensures we don't connect to 0,0,0 if a point was skipped?
                // Actually tempPositions is dense valid points now.
                
                if (segLenSq < 0.09) { // 0.3 * 0.3
                    // Valid Segment
                    positions[lineIndex*3] = x1;
                    positions[lineIndex*3+1] = y1;
                    positions[lineIndex*3+2] = z1;
                    
                    positions[(lineIndex+1)*3] = x2;
                    positions[(lineIndex+1)*3+1] = y2;
                    positions[(lineIndex+1)*3+2] = z2;

                    // Color (Gradient or fixed)
                    colors[lineIndex*3] = tempColors[i*3];
                    colors[lineIndex*3+1] = tempColors[i*3+1];
                    colors[lineIndex*3+2] = tempColors[i*3+2];

                    colors[(lineIndex+1)*3] = tempColors[(i+1)*3];
                    colors[(lineIndex+1)*3+1] = tempColors[(i+1)*3+1];
                    colors[(lineIndex+1)*3+2] = tempColors[(i+1)*3+2];

                    lineIndex += 2;
                    
                    // Add to clean cloud for SLAM (avoid duplicates slightly roughly)
                    cleanPoints.push({x: x1, y: z1}); 
                }
            }

            pointsGeometry.attributes.position.needsUpdate = true;
            pointsGeometry.attributes.color.needsUpdate = true;
            pointsGeometry.setDrawRange(0, lineIndex); // 2 points per segment
            pointsGeometry.computeBoundingSphere(); // CRITICAL: Update bounds for Raycaster!
            
            document.getElementById('statValid').innerText = validCount;

            // --- SLAM UPDATE ---
            if (isMapping && cleanPoints.length > 10) {
                // Use CLEAN points for mapping (more stable)
                
                const cos = Math.cos(robotPose.theta);
                const sin = Math.sin(robotPose.theta);
                const gPos = mapGeo.attributes.position.array;
                
                // Add 1 scan every 5 frames
                if (frames % 5 === 0) {
                    // Stride for performance
                    for(let i=0; i<cleanPoints.length; i+=4) { 
                        if (mapIndex >= MAP_SIZE) break;
                        
                        const lx = cleanPoints[i].x;
                        const lz = cleanPoints[i].y; 

                        const gx = lx * cos - lz * sin + robotPose.x;
                        const gz = lx * sin + lz * cos + robotPose.y; 
                        
                        gPos[mapIndex*3] = gx;
                        gPos[mapIndex*3+1] = 0;
                        gPos[mapIndex*3+2] = gz;
                        mapIndex++;
                    }
                    mapGeo.attributes.position.needsUpdate = true;
                    mapGeo.setDrawRange(0, mapIndex);
                    mapGeo.computeBoundingSphere(); // CRITICAL: Update bounds for Raycaster!
                }
            }
        }
    // } // Removed extra brace

    function parseInfo(pkt) {
        // Payload start index 5. Length 7.
        // Data format from legacy: Major, Minor, Patch, HW1, HW2, HW3 (Hex strings)
        // Packet: 5A 77 FF 07 00 10 [Ver 3bytes] [HW 3bytes] CS
        // Actually legacy parser sliced bytes 6-12 of the string...
        // Let's just show hex values
        const ver = `${pkt[6].toString(16)}.${pkt[7].toString(16)}.${pkt[8].toString(16)}`;
        const hw = `${pkt[9].toString(16)}.${pkt[10].toString(16)}.${pkt[11].toString(16)}`;
        document.getElementById('infoVer').innerText = ver;
        document.getElementById('infoHW').innerText = hw;
        document.getElementById('infoSerial').innerText = "Detected";
    }

    function updateUI(connected) {
        document.getElementById('btnConnect').classList.toggle('hidden', connected);
        document.getElementById('btnDisconnect').classList.toggle('hidden', !connected);
        const b = document.getElementById('statusBadge');
        b.innerText = connected ? "Connected" : "Disconnected";
        b.className = `status-badge ${connected ? 'status-connected' : 'status-disconnected'}`;
    }

    // SLAM UI Actions
    function toggleMapping() {
        isMapping = !isMapping;
        document.getElementById('btnMap').innerText = isMapping ? "Stop Map" : "Start Map";
        document.getElementById('btnMap').className = isMapping ? "btn btn-primary" : "btn btn-secondary";
    }

    function resetMap() {
        mapIndex = 0;
        mapGeo.setDrawRange(0, 0);
        robotPose = { x:0, y:0, theta:0 };
        robotGroup.position.set(0,0,0);
        robotGroup.rotation.y = 0;
    }

    // Manual Teleop (Simulated Odometry)
    window.addEventListener('keydown', (e) => {
        const speed = 0.1;
        const rotSpeed = 0.1;
        
        switch(e.key.toLowerCase()) {
            case 'w': robotPose.x -= Math.sin(robotPose.theta)*speed; robotPose.y += Math.cos(robotPose.theta)*speed; break; // Forward (Z)
            case 's': robotPose.x += Math.sin(robotPose.theta)*speed; robotPose.y -= Math.cos(robotPose.theta)*speed; break;
            case 'a': robotPose.theta += rotSpeed; break;
            case 'd': robotPose.theta -= rotSpeed; break;
        }

        // Update Arrow
        robotGroup.position.set(robotPose.x, 0, robotPose.y);
        robotGroup.rotation.y = robotPose.theta + Math.PI; // Adjust for arrow orientation
    });
</script>
